# DFM 可制造性检查 — 阈值配置
# 按 process 切换：FDM（熔融沉积） / SLA（光固化）
# 用法：DFMRules(config_path) → rules.get('min_wall_thickness')

process: FDM  # FDM | SLA

# ── 打印机硬件参数 ──
printer:
  nozzle_diameter: 0.4       # mm，喷嘴直径
  layer_height: 0.2          # mm，层高
  build_volume: [220, 220, 250]  # mm，最大成型尺寸 [X, Y, Z]

# ── 壁厚与结构 ──
wall:
  min_wall_thickness: 1.2    # mm，最小壁厚（FDM = 喷嘴×3，SLA = 0.5~0.8）
  min_feature_size: 0.4      # mm，最小特征尺寸（= 喷嘴直径）
  max_slenderness_ratio: 12  # 细长比上限（高度/最小宽度），超过变形风险
  lattice_min_wall: 0.8      # mm，镂空点阵壁厚下限

# ── 悬垂与支撑 ──
overhang:
  critical_angle: 45         # 度，朝下面法线与-Z轴夹角小于此值视为悬垂；竖直侧壁不算
  max_overhang_area_ratio: 0.30  # 非底面悬垂面积占总表面积的阻断阈值
  min_contact_area: 3.0      # mm²，最小支撑接触面积
  bridge_max_span: 15.0      # mm，桥接最大跨度（FDM独有）

# ── 空腔 ──
cavity:
  min_cavity_volume: 1.0     # mm³，忽略小于此体积的封闭空腔
  sdf_pitch: 1.5             # mm，SDF 体素边长（越小越精确越慢，≤0.3 注意内存）
  require_drain_hole: false  # 光固化中空模型必须排液孔（SLA 模式自动开启）

# ── 尺寸与装配 ──
dimension:
  min_hole_diameter: 0.4     # mm，最小内孔直径（= 喷嘴直径）
  gap_threshold: 0.25        # mm，装配间隙下限（小于此值粘连）
  min_thread_pitch: 0.6      # mm，最小可打印螺纹牙距

# ── 平台贴合 ──
platform:
  min_bottom_area: 5.0       # mm²，底面最小接触面积
  z_tolerance: 0.00001       # mm，Z 向容差
  normalized_up_axis: y      # Hunyuan3D 归一化输出采用 Y-up；打印坐标统一转换为 Z-up

# ── 自动修复参数 ──
repair:
  repair_stage_timeout_seconds: 120 # 每个隔离修复阶段的硬超时；超时保留最后有效网格
  merge_close_tolerance: 0.01    # mm，仅合并此距离内的顶点，禁止使用库默认相对阈值
  max_hole_edges: 30             # 补洞边界的最大边数，不是毫米/半径
  meshfix_timeout_seconds: 120   # MeshFix 单任务超时
  pedestal_style: auto           # auto | disc | block
  pedestal_margin_mm: 2.0        # 底座相对支撑轮廓的水平外扩量
  pedestal_thickness_mm: 2.0     # 平台以下的主体厚度
  pedestal_taper_angle_deg: 60   # 侧壁相对水平面的角度，90 为垂直
  pedestal_attachment_overlap_mm: 0.4  # 向模型内部伸入，保证布尔并集存在实体交叠
  pedestal_contact_band_mm: 0.4  # 最低点以上用于估计脚部/支撑轮廓的高度带
  pedestal_max_dimension_mm: 180 # 自动底座 X/Y 任一方向的最大尺寸
  pedestal_voxel_pitch_mm: 0.4   # mini 环境无布尔后端时的体素融合基础精度
  pedestal_voxel_max_cells: 12000000 # 体素融合内存护栏，超限时自动增大 pitch
  pedestal_allow_voxel_fallback: true # 完整版服务器安装 manifold3d 后可关闭
  stability_margin_mm: 1.0       # 重心投影距支撑多边形边界的最小安全裕量
  fragment_max_ratio: 0.01       # 自动删除必须同时低于主体表面积的 1%
  fragment_max_area_mm2: 10.0    # 自动删除必须同时低于此绝对表面积
  fragment_max_extent_mm: 2.0    # 自动删除必须同时满足最长边小于此值
  fragment_protect_distance_mm: 0.2 # 距主体过近或 AABB 相交时保护，交给融合/人工复核

# ── CuraEngine FDM 切片仿真 ──
slicer:
  cura_timeout_seconds: 120      # 本地同步切片超时；服务器异步任务可覆盖
  filament_density_g_cm3: 1.24   # PLA 参考密度，仅用于耗材质量估算

# ── 本地/服务器性能护栏 ──
performance:
  wall_sample_count: 800          # 壁厚射线采样数；服务器可按模型复杂度上调
  self_intersection_max_faces: 200000  # 超过后返回 UNKNOWN，交由异步服务器任务处理

# ── 评分权重 ──
scoring:
  watertight_topology: 25
  wall_thickness: 25
  overhang_support: 20
  dimension_compliance: 15
  feature_structure: 10
  cavity: 5

# ── SLA 光固化覆盖项（process: SLA 时生效） ──
sla_overrides:
  min_wall_thickness: 0.6
  min_feature_size: 0.3
  critical_angle: 30
  require_drain_hole: true
  layer_height: 0.05
